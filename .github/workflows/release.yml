# Every push to main that passes the offline Windows gate becomes a GitHub release. Pull requests run the same
# steps up to, but not including, publishing. See "Releases" in README.md.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

# Queued, never cancelled: two releases computing the next tag at once would collide.
concurrency:
  group: release-${{ github.ref }}

env:
  BUN_VERSION: 1.4.4

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install search tools
        run: choco install ripgrep fd --yes --no-progress
      - name: TEMP diagnose PowerShell probe
        shell: bash
        run: |
          bun -e "
          import {spawnSync} from 'node:child_process';
          import {renameSync} from 'node:fs';
          import {windowsProbeEnvironment} from './scripts/preflight-windows.mjs';
          const ps='C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe';
          const env=windowsProbeEnvironment(process.cwd());
          const go=cmd=>'[void](Get-ExecutionPolicy)';
          const t=(name,cmd,e)=>{const s=Date.now();const r=spawnSync(ps,['-NoLogo','-NoProfile','-NonInteractive','-Command',cmd],{env:e,encoding:'utf8',windowsHide:true,timeout:90000});console.log('DIAG',name,Date.now()-s,'ms',r.status,r.error?.code??'',(r.stdout||'').slice(0,1500),(r.stderr||'').slice(0,300))};
          const P='[void](Get-ExecutionPolicy)';
          t('modulepath','\$env:PSModulePath',env);
          t('module-dirs','\$env:PSModulePath -split [char]59 | % { if(Test-Path \$_){ \"\$_ = \" + @(Get-ChildItem \$_ -ErrorAction SilentlyContinue).Count } }',env);
          t('baseline',P,env);
          t('import-first','Import-Module Microsoft.PowerShell.Security; '+P,env);
          t('psmodulepath-system',P,{...env,PSModulePath:'C:/Windows/system32/WindowsPowerShell/v1.0/Modules'});
          t('localappdata-1',P,{...env,LOCALAPPDATA:process.env.LOCALAPPDATA});
          t('localappdata-2',P,{...env,LOCALAPPDATA:process.env.LOCALAPPDATA});
          t('analysis-cache-1',P,{...env,PSModuleAnalysisCachePath:process.env.RUNNER_TEMP+'/ps.cache'});
          t('analysis-cache-2',P,{...env,PSModuleAnalysisCachePath:process.env.RUNNER_TEMP+'/ps.cache'});
          t('fullenv',P,process.env);
          t('fullenv-no-psmodulepath',P,Object.fromEntries(Object.entries(process.env).filter(([k])=>k.toUpperCase()!=='PSMODULEPATH')));
          "
      - run: bun run check:windows
      - run: bun run test:windows

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Choose the next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          IFS=. read -r major minor patch <<< "${previous:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *) version="$major.$minor.$((patch + 1))" ;;
          esac
          # A re-run of a commit that is already released must not publish it twice.
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then already=true; else already=false; fi
          {
            echo "previous=$previous"
            echo "version=$version"
            echo "already=$already"
          } >> "$GITHUB_OUTPUT"
          echo "Previous: ${previous:-none}; next: v$version; already released: $already"
      - name: Build the package
        if: steps.version.outputs.already == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          # The version lives in the tag; package.json stays 0.0.0 in Git and is stamped only for the tarball.
          bun pm version "$VERSION" --no-git-tag-version
          mkdir dist
          bun pm pack --ignore-scripts --quiet --destination dist
          (cd dist && sha256sum ./*.tgz > SHA256SUMS)
          # This repository merges locally, so GitHub's PR-based generated notes would be empty.
          git log --no-merges --format='- %s (%h)' ${PREVIOUS:+"$PREVIOUS..HEAD"} > dist/notes.md
          ls -l dist
          cat dist/notes.md
      - name: Publish the release
        if: github.event_name != 'pull_request' && steps.version.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.tgz dist/SHA256SUMS \
            --title "v$VERSION" --notes-file dist/notes.md --target "$GITHUB_SHA"
