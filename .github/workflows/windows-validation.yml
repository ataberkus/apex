# Temporary: native Windows validation of the performance pass (d0c6d2b vs this branch). Remove after the report.
name: Windows validation
on:
  push:
    branches: [claude/compassionate-franklin-w43wqb]
    paths: ['.github/workflows/windows-validation.yml', '.github/windows-validation/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
# Per commit, so a follow-up push never cancels a run still measuring. Jobs run only when the head commit message names
# them: [wv:all] or [wv:suite], [wv:parallel], [wv:checkpoints], [wv:dashboard].
concurrency:
  group: windows-validation-${{ github.sha }}
  cancel-in-progress: true
env:
  BASE_SHA: d0c6d2b04938156cd64df3963459ff448401ea92
  BUN_VERSION: 1.4.4

jobs:
  suite:
    name: check + test (base vs branch)
    if: contains(github.event.head_commit.message, '[wv:all]') || contains(github.event.head_commit.message, '[wv:suite]')
    runs-on: windows-latest
    timeout-minutes: 120
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, path: branch }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - name: Machine, tools and Defender
        run: ./branch/.github/windows-validation/setup.ps1
      - name: Worktrees and install
        run: |
          git -C branch worktree add ../base $env:BASE_SHA
          foreach ($d in 'base', 'branch') { Push-Location $d; bun install --frozen-lockfile --ignore-scripts; if ($LASTEXITCODE) { exit 1 }; Pop-Location }
      - name: check:windows
        run: |
          foreach ($d in 'base', 'branch') { Push-Location $d; bun run check:windows; "CHECK-RESULT $d exit=$LASTEXITCODE" | Tee-Object -Append ../results/check.txt; Pop-Location }
          exit 0
      - name: test:windows base (default parallel)
        run: bun branch/.github/windows-validation/run-suite.mjs base base-default results
      - name: test:windows branch (default parallel)
        run: bun branch/.github/windows-validation/run-suite.mjs branch branch-default results
      - name: Summary
        if: always()
        run: bun branch/.github/windows-validation/summarize.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: suite-results, path: results }

  parallel:
    name: test:windows parallel 2 vs 4
    if: contains(github.event.head_commit.message, '[wv:all]') || contains(github.event.head_commit.message, '[wv:parallel]')
    runs-on: windows-latest
    timeout-minutes: 200
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, path: branch }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - name: Machine, tools and Defender
        run: ./branch/.github/windows-validation/setup.ps1
      - name: Install
        run: Push-Location branch; bun install --frozen-lockfile --ignore-scripts; exit $LASTEXITCODE
      - name: Interleaved runs (2, 4, 2, 4, 2, 4)
        run: |
          foreach ($i in 1..3) { foreach ($p in 2, 4) { bun branch/.github/windows-validation/run-suite.mjs branch "p$p-run$i" results $p } }
      - name: Summary
        if: always()
        run: bun branch/.github/windows-validation/summarize.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: parallel-results, path: results }

  checkpoints:
    name: checkpoint timing (base vs branch)
    if: contains(github.event.head_commit.message, '[wv:all]') || contains(github.event.head_commit.message, '[wv:checkpoints]')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, path: branch }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - name: Machine, tools and Defender
        run: ./branch/.github/windows-validation/setup.ps1
      - name: Base worktree
        run: git -C branch worktree add ../base $env:BASE_SHA
      - name: Benchmark (two alternating rounds, 8 turns each)
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          foreach ($round in 1, 2) { foreach ($d in 'base', 'branch') {
            $line = bun branch/.github/windows-validation/bench-checkpoints.mjs "$d/extensions/apex-features/checkpoints.mjs" "$d-round$round" 8
            if ($LASTEXITCODE) { "BENCH-FAILED $d round $round exit=$LASTEXITCODE" }
            $line | Tee-Object -Append results/checkpoints.jsonl
          } }
      - name: Summary
        if: always()
        run: bun branch/.github/windows-validation/summarize.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: checkpoint-results, path: results }

  dashboard:
    name: dashboard probe, micro, package smoke
    if: contains(github.event.head_commit.message, '[wv:all]') || contains(github.event.head_commit.message, '[wv:dashboard]')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, path: branch }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - name: Machine, tools and Defender
        run: ./branch/.github/windows-validation/setup.ps1
      - name: Worktrees and install
        run: |
          git -C branch worktree add ../base $env:BASE_SHA
          foreach ($d in 'base', 'branch') { Push-Location $d; bun install --frozen-lockfile --ignore-scripts; if ($LASTEXITCODE) { exit 1 }; Pop-Location }
      - name: Windows PowerShell probe timing
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          bun branch/.github/windows-validation/ps-probe.mjs branch | Tee-Object -Append results/ps.jsonl
      - name: Stop probe (Pi exit after stdin EOF, no kill fallback)
        run: |
          foreach ($d in 'base', 'branch') { bun branch/.github/windows-validation/stop-probe.mjs (Resolve-Path $d).Path | Tee-Object -Append results/stop.jsonl }
          exit 0
      - name: Dashboard probe (base, branch)
        run: |
          foreach ($d in 'base', 'branch') { bun branch/.github/windows-validation/dashboard-probe.mjs (Resolve-Path $d).Path "$d-round3" | Tee-Object -Append results/dashboard.jsonl }
          exit 0
      - name: micro:windows and smoke:windows-package (branch, then base; up to 3 attempts while BLOCKED)
        run: |
          foreach ($d in 'branch', 'base') { Push-Location $d
            foreach ($script in 'micro:windows', 'smoke:windows-package') {
              foreach ($attempt in 1..3) { bun run $script; $rc = $LASTEXITCODE; "RUN $d $script attempt=$attempt exit=$rc" | Tee-Object -Append ../results/micro-smoke.txt; if ($rc -ne 2) { break } }
            }
            Pop-Location }
          exit 0
      - name: Summary
        if: always()
        run: bun branch/.github/windows-validation/summarize.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dashboard-results, path: results }

  diag:
    name: diagnostics (idle timing, auto-gc, isolated branch-only tests)
    if: contains(github.event.head_commit.message, '[wv:all]') || contains(github.event.head_commit.message, '[wv:diag]')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, path: branch }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - name: Machine, tools and Defender
        run: ./branch/.github/windows-validation/setup.ps1
      - name: Install
        run: Push-Location branch; bun install --frozen-lockfile --ignore-scripts; exit $LASTEXITCODE
      - name: Idle timing (edit pre-check vs d0c6d2b reference, delete check)
        run: |
          foreach ($i in 1..2) { bun branch/.github/windows-validation/timing.mjs branch | Tee-Object -Append results/timing.jsonl }
      - name: Auto-gc probe
        run: bun branch/.github/windows-validation/gc-probe.mjs branch | Tee-Object -Append results/gc.jsonl
      - name: Branch-only failures, each alone three times
        run: |
          Push-Location branch
          $tests = @(
            @('tests/features-checkpoints-io.test.mjs', 'a kept mirror file that Git maps to the wrong blob'),
            @('tests/features-checkpoints-io.test.mjs', 'auto-gc triggered by a shadow commit'),
            @('tests/core-control.test.mjs', 'edit precondition stops at the native writer'),
            @('tests/core-control.test.mjs', 'a 100 KB single-line command is checked'))
          foreach ($t in $tests) { foreach ($i in 1..3) {
            $out = bun test --timeout=600000 --preload ./scripts/live-builtins.mjs "./$($t[0])" -t $t[1] 2>&1 | Out-String
            $fail = ($out -split "`n" | Where-Object { $_ -match '^\s*\d+ fail|^error:|took|median|Expected|!==' } | Select-Object -First 6) -join ' / '
            "ISOLATED [$($t[1])] run $i : $fail" | Tee-Object -Append ../results/isolated.txt
          } }
          Pop-Location
          exit 0
      - name: Summary
        if: always()
        run: |
          bun branch/.github/windows-validation/summarize.mjs results
          Get-Content results/isolated.txt -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag-results, path: results }

  microsmoke:
    name: micro + package smoke with stock Defender (off)
    if: contains(github.event.head_commit.message, '[wv:all]') || contains(github.event.head_commit.message, '[wv:microsmoke]')
    runs-on: windows-latest
    timeout-minutes: 40
    defaults: { run: { shell: pwsh } }
    env: { APEX_STOCK_DEFENDER: '1' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, path: branch }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - name: Machine and tools
        run: ./branch/.github/windows-validation/setup.ps1
      - name: Worktrees and install
        run: |
          git -C branch worktree add ../base $env:BASE_SHA
          foreach ($d in 'base', 'branch') { Push-Location $d; bun install --frozen-lockfile --ignore-scripts; if ($LASTEXITCODE) { exit 1 }; Pop-Location }
      - name: Windows PowerShell probe timing
        run: bun branch/.github/windows-validation/ps-probe.mjs branch | Tee-Object -Append results/ps.jsonl
      - name: check, micro and smoke (branch, then base; up to 3 attempts while BLOCKED)
        run: |
          foreach ($d in 'branch', 'base') { Push-Location $d
            foreach ($script in 'check:windows', 'micro:windows', 'smoke:windows-package') {
              foreach ($attempt in 1..3) { bun run $script; $rc = $LASTEXITCODE; "RUN $d $script attempt=$attempt exit=$rc" | Tee-Object -Append ../results/micro-smoke.txt; if ($rc -ne 2) { break } }
            }
            Pop-Location }
          exit 0
      - name: Summary
        if: always()
        run: bun branch/.github/windows-validation/summarize.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: microsmoke-results, path: results }
